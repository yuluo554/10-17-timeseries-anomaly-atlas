[build-system]
# >=77 is the first setuptools that understands the SPDX `license` string and
# `license-files` (PEP 639); with an older floor the metadata falls back to the deprecated
# TOML-table form and `python -m build` prints deprecation warnings again.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-atlas"
version = "0.1.1"
description = "Time series -> reproducible anomaly archive: episodes with detector, params, score and source rows, plus a zero-CDN single-file HTML that recomputes the same sha256"
readme = "README.md"
# Floor raised from 3.8 (EOL 2024-10-07) to 3.12 (EOL 2028-10-31); 3.9/3.10 are EOL too.
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = ["anomaly-detection", "time-series", "reproducibility", "single-file-html", "agent-skill"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.scripts]
anomaly-atlas = "anomaly_atlas.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

# The M3 mirror is data next to the module (`mirror/zaa_mirror.js`), not importable Python: it has
# to travel with the package, or an installed `verify` cannot find the mirror it must run.
[tool.setuptools.package-data]
anomaly_atlas = ["mirror/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
