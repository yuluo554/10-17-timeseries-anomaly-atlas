name: ci

# Every push/tag event is expected to produce exactly one run and to be green; the
# release milestone reconciles that (plan/05 M6). A tag push produces its own run and
# must be green too.
on: [push, pull_request, workflow_dispatch]

# PYTHONUTF8=1 covers every step in this job, including the ones we do not type
# ourselves (`python -m pytest`), plus subprocess decode paths that `-X utf8` cannot reach.
env:
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # 3.8 is EOL (2024-10-07), 3.9 is EOL (2025-10-31) and 3.10 is EOL too (2026-10-01);
        # the floor is 3.12 (EOL 2028-10-31). One supported interpreter per OS: adding a leg
        # is a deliberate act, not a default.
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      # v7: the v4/v5 pair targeted Node 20, and once the runners forced Node 24 every run
      # printed a deprecation warning (measured 2026-10-20: 4 warnings on the last run).
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev extra
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      # Smoke the two import paths separately: `python -m <pkg>` and the bare console
      # script resolve `sys.path` differently, so passing one proves nothing about the
      # other (the "install surface" family).
      - name: CLI smoke (module form)
        run: python -m anomaly_atlas.cli --help
      - name: CLI smoke (bare form)
        run: anomaly-atlas --help
      - name: CLI smoke (version)
        run: anomaly-atlas --version
      # Each newly delivered command adds a smoke step here in the same commit that
      # delivers it, and retires any stale exit-code assertion it replaces (an assertion
      # written for a placeholder becomes a lie the moment the module lands).
      - name: CLI smoke (profile, offline, two runs byte-identical)
        run: |
          python -m anomaly_atlas.cli profile data/synthetic/series.csv -o profile-smoke-a.json
          python -m anomaly_atlas.cli profile data/synthetic/series.csv -o profile-smoke-b.json
          python -c "import pathlib,sys;sys.exit(0 if pathlib.Path('profile-smoke-a.json').read_bytes()==pathlib.Path('profile-smoke-b.json').read_bytes() else 1)"
      - name: CLI smoke (profile via the bare console script)
        run: anomaly-atlas profile data/samples/minimal.csv -o profile-smoke-minimal.json
      - name: CLI smoke (detect, offline, two runs byte-identical)
        run: |
          python -m anomaly_atlas.cli detect data/synthetic/series.csv --out-dir out/smoke-a
          python -m anomaly_atlas.cli detect data/synthetic/series.csv --out-dir out/smoke-b
          python -c "import pathlib,sys;sys.exit(0 if pathlib.Path('out/smoke-a/run.json').read_bytes()==pathlib.Path('out/smoke-b/run.json').read_bytes() and pathlib.Path('out/smoke-a/anomalies.json').read_bytes()==pathlib.Path('out/smoke-b/anomalies.json').read_bytes() else 1)"
      - name: CLI smoke (detect digest file matches the archive it names)
        run: |
          python -c "import hashlib,pathlib,sys;p=pathlib.Path('out/smoke-a/anomalies.json');d=hashlib.sha256(p.read_bytes()).hexdigest();r=pathlib.Path('out/smoke-a/anomaly_set.sha256').read_text().strip();print('anomaly-set sha256',d);sys.exit(0 if d==r else 1)"
      - name: CLI smoke (detect via the bare console script)
        run: anomaly-atlas detect data/samples/minimal.csv --out-dir out/smoke-minimal
      - name: "CLI smoke (selftest: ledger + truth reconciliation + digest tripwire + probes)"
        run: python -m anomaly_atlas.cli selftest
      # M4: the annotated view. Two runs of one input must be byte-identical, and the artifact must
      # stay self-contained -- both asserted here again on a freshly built file, not only on the
      # committed one (a builder that regressed would otherwise hide behind a stale example).
      - name: CLI smoke (render, offline, two runs byte-identical)
        run: |
          python -m anomaly_atlas.cli render data/synthetic/series.csv -o out/render-a.html
          python -m anomaly_atlas.cli render data/synthetic/series.csv -o out/render-b.html
          python -c "import pathlib,sys;a=pathlib.Path('out/render-a.html').read_bytes();b=pathlib.Path('out/render-b.html').read_bytes();print('artifact bytes',len(a));sys.exit(0 if a==b else 1)"
      - name: "CLI smoke (the rendered artifact is self-contained: no external resource, no request)"
        run: |
          python -c "from anomaly_atlas import render;t=open('out/render-a.html',encoding='utf-8').read();render.assert_no_external_resources(t);render.assert_no_template_slots(t);print('zero external resources + no surviving slot asserted at the artifact layer')"
      - name: CLI smoke (render via the bare console script)
        run: anomaly-atlas render data/samples/minimal.csv -o out/render-minimal.html
      # M5: the report number whitelist. `detect` exports the ledger and `check-report` gates a
      # narrative against it -- and the negative half is the point: a fabricated number must be
      # refused with exit 1 while a narrative of citations passes with 0. A step that only ran the
      # happy path would pass for a gate that accepts everything.
      - name: "CLI smoke (check-report: citations pass, a fabricated number is refused)"
        run: |
          python -m anomaly_atlas.cli detect data/synthetic/series.csv --out-dir out/facts
          python -c "import pathlib,sys;pathlib.Path('narrative-ok.txt').write_text('共 178 段异常、653 个异常点。',encoding='utf-8');pathlib.Path('narrative-bad.txt').write_text('共 987654321 段异常。',encoding='utf-8');sys.exit(0 if pathlib.Path('out/facts/facts.json').is_file() else 1)"
          python -m anomaly_atlas.cli check-report --facts out/facts/facts.json --text narrative-ok.txt
          python -c "import subprocess,sys;r=subprocess.run([sys.executable,'-m','anomaly_atlas.cli','check-report','--facts','out/facts/facts.json','--text','narrative-bad.txt'],capture_output=True,text=True);print(r.stdout+r.stderr);sys.exit(0 if r.returncode==1 and '987654321' in r.stdout and 'report NOT generated' in r.stdout else 1)"
      - name: "CLI smoke (check-report via the bare console script)"
        run: anomaly-atlas check-report --facts out/facts/facts.json --text narrative-ok.txt
      - name: CLI smoke (render refuses a narrative with a fabricated number, writes nothing)
        run: |
          python -c "import subprocess,sys,pathlib;out=pathlib.Path('out/atlas-bad-narrative.html');r=subprocess.run([sys.executable,'-m','anomaly_atlas.cli','render','data/synthetic/series.csv','-o',str(out),'--narrative','narrative-bad.txt'],capture_output=True,text=True);print(r.stdout+r.stderr);sys.exit(0 if r.returncode==1 and not out.exists() else 1)"
      - name: CLI smoke (no command answers exit code 3 any more)
        run: |
          python -c "from anomaly_atlas import cli;assert cli.STAGE_NOT_READY=={}, cli.STAGE_NOT_READY;assert not hasattr(cli,'EXIT_NOT_READY');print('stage-not-ready registry is empty and the constant is gone')"
      # M3: the browser recomputation gate. Node is preinstalled on the runners, but the presence
      # check is explicit -- the gate answers exit 4 when Node is missing, and a step that silently
      # degraded into "nothing to check" would be exactly the failure mode the contract forbids.
      - name: Node is present (the recomputation gate is never silently skipped)
        run: node --version
      - name: CLI smoke (artifact + Node recomputation parity)
        run: |
          python tools/mirror_parity.py --build out/atlas-built.html
          python -m anomaly_atlas.cli verify out/atlas-built.html
          python -m anomaly_atlas.cli verify out/render-a.html
          python -m anomaly_atlas.cli verify examples/atlas.html
      - name: "CLI smoke (verify tampers one inline point: must MISMATCH, localise, exit 1)"
        run: |
          python -c "import subprocess,sys;r=subprocess.run([sys.executable,'-m','anomaly_atlas.cli','verify','examples/atlas.html','--tamper-index','3'],capture_output=True,text=True);print(r.stdout+r.stderr);sys.exit(0 if r.returncode==1 and 'MISMATCH' in r.stderr and 'energy_kwh' in r.stdout else 1)"
      - name: CLI smoke (verify without Node exits 4, never 0)
        run: |
          python -c "import subprocess,sys;r=subprocess.run([sys.executable,'-m','anomaly_atlas.cli','verify','examples/atlas.html','--node','no-such-node-executable'],capture_output=True,text=True);print(r.stdout+r.stderr);sys.exit(0 if r.returncode==4 else 1)"
      - name: CLI smoke (mirror_parity on the artifact the repository builds)
        run: python tools/mirror_parity.py --html examples/atlas.html
      - name: Generator smoke (frozen artifacts + bit-for-bit regeneration)
        run: python tools/gen_synthetic_series.py --check
